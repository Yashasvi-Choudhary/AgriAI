<!-- Government Schemes page -->
{% extends "base.html" %} {% block page_name %} government-schemes {% endblock
%} {% block title %} Government Schemes {% endblock %} {% block content %}

<div class="bg-background py-10 relative">
  <div class="max-w-6xl mx-auto px-4 py-10 sm:px-6 lg:px-8">
    <!-- ── PAGE HEADER ── -->
    <div class="mb-8">
      <div class="flex items-center gap-3 mb-1.5">
        <div
          class="flex items-center justify-center w-11 h-11 rounded-xl flex-shrink-0 bg-gradient-to-br from-primary to-primaryDark shadow-sm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-white"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"
            />
            <polyline points="17 21 17 13 7 13 7 21" />
            <polyline points="7 5 7 9 17 9 17 5" />
          </svg>
        </div>
        <div>
          <h1
            class="text-2xl sm:text-3xl font-bold leading-tight text-textDark font-heading"
            data-i18n="govt_schemes_title"
          ></h1>
          <p
            class="text-sm mt-0.5 text-textLight"
            data-i18n="govt_schemes_subtitle"
          ></p>
        </div>
      </div>
    </div>

    <!-- ── FILTER CARD ── -->
    <div
      class="bg-white rounded-2xl border p-6 sm:p-8 mb-7 border-backgroundDark shadow-sm"
    >
      <div class="flex items-center gap-2 mb-6">
        <div class="w-1 h-5 rounded-full bg-primaryLight"></div>
        <h2
          class="text-xs font-bold uppercase tracking-widest text-textMid"
          data-i18n="govt_schemes_filter_section_title"
        ></h2>
      </div>

      <div
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-x-6 gap-y-6"
      >
        <!-- State Filter -->
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider mb-1.5 text-textMid"
            data-i18n="govt_schemes_filter_state"
          ></label>
          <div class="relative">
            <span
              class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-textLight"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"
                />
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"
                />
              </svg>
            </span>
            <select
              id="stateFilter"
              class="w-full rounded-lg border border-backgroundDark py-2.5 pl-9 pr-4 text-sm bg-white text-textDark outline-none focus:outline-none focus:ring-2 focus:ring-primaryLight/50 focus:border-primary transition-all"
              onchange="applyFilters()"
            >
              <option value="">All States</option>
              <option value="All">National Schemes</option>
              <option value="Chhattisgarh">Chhattisgarh</option>
              <option value="Maharashtra">Maharashtra</option>
              <option value="Uttar Pradesh">Uttar Pradesh</option>
              <option value="Karnataka">Karnataka</option>
              <option value="Madhya Pradesh">Madhya Pradesh</option>
              <option value="Punjab">Punjab</option>
              <option value="Haryana">Haryana</option>
              <option value="Rajasthan">Rajasthan</option>
            </select>
          </div>
        </div>

        <!-- Crop Type Filter -->
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider mb-1.5 text-textMid"
            data-i18n="govt_schemes_filter_crop"
          ></label>
          <div class="relative">
            <span
              class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-textLight"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 3v18m-7-7h14M7 10.5h10M7 17.5h10"
                />
              </svg>
            </span>
            <select
              id="cropFilter"
              class="w-full rounded-lg border border-backgroundDark py-2.5 pl-9 pr-4 text-sm bg-white text-textDark outline-none focus:outline-none focus:ring-2 focus:ring-primaryLight/50 focus:border-primary transition-all"
              onchange="applyFilters()"
            >
              <option value="">All Crops</option>
              <option value="All">All Crop Types</option>
              <option value="Wheat">Wheat</option>
              <option value="Rice">Rice</option>
              <option value="Maize">Maize</option>
              <option value="Cotton">Cotton</option>
              <option value="Sugarcane">Sugarcane</option>
              <option value="Livestock">Livestock</option>
              <option value="Fisheries">Fisheries</option>
              <option value="Organic">Organic</option>
            </select>
          </div>
        </div>

        <!-- Search Box -->
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider mb-1.5 text-textMid"
            data-i18n="govt_schemes_search_placeholder"
          ></label>
          <div class="relative">
            <span
              class="absolute inset-y-0 left-3 flex items-center pointer-events-none text-textLight"
            >
              <svg
                class="w-4 h-4"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                />
              </svg>
            </span>
            <input
              type="text"
              id="searchBox"
              class="w-full rounded-lg border border-backgroundDark py-2.5 pl-9 pr-4 text-sm bg-white text-textDark outline-none focus:outline-none focus:ring-2 focus:ring-primaryLight/50 focus:border-primary transition-all"
              placeholder="Search schemes..."
              onkeyup="applyFilters()"
            />
          </div>
        </div>
      </div>
    </div>

    <!-- ── LOADING STATE ── -->
    <div
      id="loadingState"
      class="bg-white rounded-2xl border p-12 border-backgroundDark shadow-sm flex flex-col items-center justify-center gap-4"
    >
      <div
        class="w-12 h-12 border-4 border-primaryLight/30 border-t-primary rounded-full animate-spin"
      ></div>
      <p class="text-sm text-textMid" data-i18n="govt_schemes_loading"></p>
    </div>

    <!-- ── SCHEMES GRID ── -->
    <div
      id="schemesGrid"
      class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"
    >
      <!-- Scheme cards will be rendered here -->
    </div>

    <!-- ── EMPTY STATE ── -->
    <div
      id="emptyState"
      class="bg-white rounded-2xl border p-12 border-backgroundDark shadow-sm text-center hidden"
    >
      <svg
        class="w-16 h-16 mx-auto mb-4 text-textLight opacity-50"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="1"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
        />
      </svg>
      <h3
        class="text-lg font-semibold text-textDark mb-1"
        data-i18n="govt_schemes_empty_title"
      ></h3>
      <p
        class="text-sm text-textMid"
        data-i18n="govt_schemes_empty_description"
      ></p>
    </div>

    <!-- ── ERROR STATE ── -->
    <div
      id="errorState"
      class="bg-red-50 rounded-2xl border border-red-200 p-6 sm:p-8 shadow-sm hidden"
    >
      <div class="flex items-start gap-3">
        <svg
          class="w-5 h-5 text-red-500 flex-shrink-0 mt-0.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 8v4m0 4v.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <div>
          <h3 class="text-sm font-semibold text-red-800 mb-1">
            <span data-i18n="govt_schemes_error_title"></span>
          </h3>
          <p id="errorMsg" class="text-sm text-red-700"></p>
        </div>
      </div>
    </div>

    <!-- ── INFO SECTION ── -->
    <div class="mt-12 bg-blue-50 rounded-2xl border border-blue-200 p-6 sm:p-8">
      <div class="flex items-start gap-3">
        <svg
          class="w-6 h-6 text-blue-600 flex-shrink-0 mt-0.5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        <div>
          <h3
            class="text-sm font-semibold text-blue-900 mb-2"
            data-i18n="govt_schemes_info_title"
          ></h3>
          <p
            class="text-sm text-blue-800 leading-relaxed"
            data-i18n="govt_schemes_info_description"
          ></p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ── SCHEME MODAL ── (Optional for detailed view) -->
<div
  id="schemeModal"
  class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4"
  onclick="closeSchemeModal()"
>
  <div
    class="bg-white rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl"
    onclick="event.stopPropagation()"
  >
    <div id="modalContent" class="p-6 sm:p-8">
      <!-- Modal content will be rendered here -->
    </div>
  </div>
</div>

<!-- ── LOAD SCRIPTS ── -->
<script src="{{ url_for('static', filename='js/government_schemes.js') }}"></script>

{% endblock %}
